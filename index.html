<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171329">
<title>Dhikr Counter</title>
<style>
:root{--bg:#100e1c;--panel:#1b1830;--panel2:#24203c;--text:#f5f3ff;--muted:#aaa4c4;--accent:#a78bfa;--accent2:#67e8f9;--line:#39324f;--button:#29243f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;touch-action:manipulation}
body{user-select:none}
.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 15px calc(env(safe-area-inset-bottom) + 8px);max-width:600px;margin:auto}
.counter-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:0}
.orb{width:min(75vw,370px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 32% 25%,#48406e,#292342 45%,#171329 80%);border:1px solid #4e456f;box-shadow:inset 0 5px 25px #ffffff12,0 20px 65px #05040c80;transition:transform .08s}
.counter-area:active .orb{transform:scale(.985)}
.counter-inner{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.count{font-size:clamp(66px,19vw,108px);font-weight:750;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;text-shadow:0 3px 25px #a78bfa33}
.hint{font-size:12px;color:var(--muted);margin-top:19px}
.bottom-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 0 3px;border-top:1px solid var(--line);margin-top:8px}
.control{border:1px solid var(--line);background:var(--button);color:var(--text);border-radius:11px;padding:7px 5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:43px}
.control.primary{border-color:#a78bfa66;background:linear-gradient(135deg,#3b315c,#28223f)}
.ico{font-size:17px;line-height:1}
.modal{display:none;position:fixed;inset:0;background:#07060cb8;z-index:10;align-items:flex-end;justify-content:center;padding:12px}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;max-height:86dvh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:19px;margin:0}
.close{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;width:36px;height:36px;font-size:20px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 4px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.setting label{font-size:13px}
.setting select,.setting input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;max-width:165px}
.setting input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
.action{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:11px;margin-top:8px;width:100%;font-weight:600;font-size:13px}
.action:disabled{opacity:.4}
.action.danger{color:#ff9baf}
.listrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.listrow .name{flex:1;font-size:13px}
.listrow button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:30px;padding:9px 14px;color:var(--text);font-size:12px;opacity:0;pointer-events:none;z-index:20}
.toast.show{opacity:1}
body.theme-blue{--bg:#081321;--panel:#10243a;--panel2:#17314c;--text:#eef8ff;--muted:#9ab4ca;--accent:#60a5fa;--accent2:#67e8f9;--line:#27445e;--button:#18324b}
body.theme-black{--bg:#000;--panel:#101010;--panel2:#1b1b1b;--text:#f4f4f4;--muted:#a2a2a2;--accent:#d4d4d4;--line:#333;--button:#1a1a1a}
body.theme-teal{--bg:#071a1b;--panel:#102b2c;--panel2:#173b3c;--text:#eaffff;--muted:#9fc8c7;--accent:#5eead4;--line:#285253;--button:#173a3b}
body.theme-rose{--bg:#21121c;--panel:#351d2b;--panel2:#48273a;--text:#fff2f7;--muted:#d2a9bc;--accent:#fb7185;--line:#63364e;--button:#48283a}
body.theme-mint{--bg:#102019;--panel:#1b3026;--panel2:#254333;--text:#f0fff5;--muted:#a9cbb5;--accent:#86efac;--line:#3a5c47;--button:#254333}
</style>
</head>
<body>
<div class="app" id="app">
<main class="counter-area" id="tapArea" role="button" tabindex="0" aria-label="Tap to count">
<div class="orb"><div class="counter-inner"><div class="count" id="count">0</div></div></div>
<div class="hint">Tap anywhere to count</div>
</main>
<div class="bottom-bar">
<button class="control" id="undo"><span class="ico">↶</span>Undo</button>
<button class="control primary" id="reset"><span class="ico">⟲</span>Reset</button>
<button class="control" id="optionsBtn"><span class="ico">☷</span>Options</button>
<button class="control" id="settingsBtn"><span class="ico">⚙</span>Settings</button>
</div>
</div>

<div class="modal" id="optionsModal"><div class="sheet">
<div class="sheet-head"><h2>Counter Options</h2><button class="close" id="closeOptions">×</button></div>
<div class="section-title">Counter</div>
<div class="setting"><label>Choose Dhikr</label><select id="dhikrSelect"></select></div>
<button class="action" id="addDhikr">＋ Add your own Dhikr</button>
<button class="action" id="targetBtn">Set target</button>
<div class="setting"><label>Daily goal</label><span id="dailyProgress">Not set</span></div>
<button class="action" id="dailyBtn">Change daily goal</button>
<button class="action" id="favoriteBtn">☆ Save current Dhikr to favorites</button>
<button class="action" id="favoritesBtn">My Dhikr — saved counts</button>
<div class="section-title">Counter tools</div>
<button class="action" id="statsBtn">View statistics</button>
<button class="action" id="clearCurrent">Clear current Dhikr count</button>
</div></div>

<div class="modal" id="settingsModal"><div class="sheet">
<div class="sheet-head"><h2>App Settings</h2><button class="close" id="closeSettings">×</button></div>
<div class="section-title">Appearance</div>
<div class="setting"><label>Theme</label><select id="theme">
<option value="purple">Midnight Purple</option><option value="blue">Ocean Blue</option><option value="black">AMOLED Black</option><option value="teal">Calm Teal</option><option value="rose">Soft Rose</option><option value="mint">Fresh Mint</option>
</select></div>
<div class="section-title">Feedback & behavior</div>
<div class="setting"><label>Tap vibration</label><input type="checkbox" id="vibration"></div>
<div class="setting"><label>Tap sound</label><input type="checkbox" id="sound"></div>
<div class="setting"><label>Target reached alert</label><input type="checkbox" id="targetAlert"></div>
<div class="setting"><label>Confirm before reset</label><input type="checkbox" id="confirmReset"></div>
<button class="action danger" id="clearAll">Delete all app data</button>
<p style="color:var(--muted);font-size:11px">Your counters and settings are stored locally on this device.</p>
</div></div>

<div class="modal" id="favoritesModal"><div class="sheet">
<div class="sheet-head"><h2>Saved Dhikr</h2><button class="close" id="closeFavorites">×</button></div>
<div id="favoritesList"></div>
</div></div>

<div class="modal" id="statsModal"><div class="sheet">
<div class="sheet-head"><h2>Statistics</h2><button class="close" id="closeStats">×</button></div>
<div id="statsContent"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='tasbihDhikrCounterV5';
const emptyState=()=>({
items:[],selected:-1,freeCount:0,freeTotal:0,session:0,
target:0,dailyGoal:0,dailyCount:0,day:new Date().toDateString(),
settings:{theme:'purple',vibration:false,sound:false,targetAlert:true,confirmReset:true},
history:[]
});

let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||!Array.isArray(state.items))state=emptyState();
state.items=state.items.filter(x=>x&&typeof x.name==='string');
if(state.selected<0||state.selected>=state.items.length)state.selected=-1;
state.freeCount=Math.max(0,Number(state.freeCount)||0);
state.freeTotal=Math.max(0,Number(state.freeTotal)||0);
state.settings={...emptyState().settings,...(state.settings||{})};
state.history=Array.isArray(state.history)?state.history:[];

function el(id){return document.getElementById(id)}
function current(){return state.items[state.selected]||null}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(message){
let t=el('toast');t.textContent=message;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),1500);
}
function dayCheck(){
let today=new Date().toDateString();
if(state.day!==today){state.day=today;state.dailyCount=0}
}
function render(){
dayCheck();
let item=current();
el('count').textContent=item?(item.count||0):state.freeCount;
el('dailyProgress').textContent=state.dailyGoal>0?state.dailyCount+' / '+state.dailyGoal:'Not set';
let select=el('dhikrSelect');
select.innerHTML='';
if(!state.items.length){
let option=document.createElement('option');
option.textContent='No Dhikr added yet';
select.append(option);select.disabled=true;
}else{
state.items.forEach((it,i)=>{
let option=document.createElement('option');
option.value=i;option.textContent=it.name+(it.favorite?' ★':'');
select.append(option);
});
select.disabled=false;select.value=String(state.selected);
}
el('favoriteBtn').disabled=!item;
el('clearCurrent').disabled=!item;
el('theme').value=state.settings.theme;
document.body.className='theme-'+state.settings.theme;
['vibration','sound','targetAlert','confirmReset'].forEach(k=>el(k).checked=!!state.settings[k]);
save();
}
function count(){
dayCheck();
let item=current();
state.history.push({
idx:state.selected,
count:item?(Number(item.count)||0):state.freeCount,
total:item?(Number(item.total)||0):state.freeTotal,
session:state.session,dailyCount:state.dailyCount
});
if(item){item.count=(Number(item.count)||0)+1;item.total=(Number(item.total)||0)+1}
else{state.freeCount++;state.freeTotal++}
state.session++;
if(state.dailyGoal>0)state.dailyCount++;
if(state.settings.vibration&&navigator.vibrate)navigator.vibrate(12);
if(state.settings.sound)beep();
render();
let now=item?item.count:state.freeCount;
if(state.target>0&&now===state.target&&state.settings.targetAlert)toast('Target reached!');
if(state.dailyGoal>0&&state.dailyCount===state.dailyGoal)toast('Daily goal completed!');
}
function undo(){
let h=state.history.pop();
if(!h||h.idx!==state.selected){toast('Nothing to undo');return}
let item=current();
if(item){item.count=h.count;item.total=h.total}
else{state.freeCount=h.count;state.freeTotal=h.total}
state.session=h.session;state.dailyCount=h.dailyCount;render();
}
function beep(){
try{
let c=new(window.AudioContext||window.webkitAudioContext)();
let o=c.createOscillator(),g=c.createGain();
o.frequency.value=740;g.gain.value=.025;
o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.045);
}catch(e){}
}
function reset(){
if(state.settings.confirmReset&&!confirm('Reset this counter to zero?'))return;
let item=current();
if(item)item.count=0;else state.freeCount=0;
state.session=0;state.history=[];render();toast('Counter reset');
}
function setTarget(){
let v=prompt('Set counter target (0 = no target)',state.target||0);
if(v===null)return;
v=parseInt(v,10);
if(!Number.isFinite(v)||v<0){toast('Enter a valid target');return}
state.target=v;
if(current())current().target=v;
render();
}
function dailyGoal(){
let v=prompt('Set daily goal (0 = no goal)',state.dailyGoal||0);
if(v===null)return;
v=parseInt(v,10);
if(!Number.isFinite(v)||v<0){toast('Enter a valid goal');return}
state.dailyGoal=v;state.dailyCount=0;state.day=new Date().toDateString();
render();
}
function openModal(id){el(id).classList.add('show')}
function closeModal(id){el(id).classList.remove('show')}

function showFavorites(){
let box=el('favoritesList');box.innerHTML='';
let list=state.items.map((it,i)=>({it,i})).filter(x=>x.it.favorite||x.it.custom);
if(!list.length){
box.textContent='No saved Dhikr yet.';
}else{
list.forEach(({it,i})=>{
let row=document.createElement('div');row.className='listrow';
let name=document.createElement('span');name.className='name';
name.textContent=it.name+' · Count: '+(it.count||0);
let use=document.createElement('button');use.textContent='Continue';
use.onclick=()=>{
state.selected=i;state.target=Number(it.target)||0;
state.session=0;state.history=[];render();
closeModal('favoritesModal');closeModal('optionsModal');
};
let fav=document.createElement('button');
fav.textContent=it.favorite?'Remove':'Save';
fav.onclick=()=>{it.favorite=!it.favorite;render();showFavorites()};
row.append(name,use,fav);box.append(row);
});
}
openModal('favoritesModal');
}
function showStats(){
let total=state.freeTotal+state.items.reduce((a,x)=>a+(Number(x.total)||0),0);
el('statsContent').innerHTML=
'<div class="setting"><label>Total counted</label><b>'+total+'</b></div>'+
'<div class="setting"><label>Today count</label><b>'+state.dailyCount+'</b></div>'+
'<div class="setting"><label>Current count</label><b>'+(current()?.count??state.freeCount)+'</b></div>'+
'<div class="setting"><label>Current session</label><b>'+state.session+'</b></div>';
openModal('statsModal');
}

el('app').addEventListener('click',e=>{
if(e.target.closest('button,select,input,.modal'))return;
count();
});
el('tapArea').addEventListener('keydown',e=>{
if(e.key==='Enter'||e.key===' '){e.preventDefault();count()}
});

el('undo').onclick=undo;
el('reset').onclick=reset;
el('optionsBtn').onclick=()=>openModal('optionsModal');
el('settingsBtn').onclick=()=>openModal('settingsModal');
el('closeOptions').onclick=()=>closeModal('optionsModal');
el('closeSettings').onclick=()=>closeModal('settingsModal');
el('closeFavorites').onclick=()=>closeModal('favoritesModal');
el('closeStats').onclick=()=>closeModal('statsModal');

['optionsModal','settingsModal','favoritesModal','statsModal'].forEach(id=>{
el(id).onclick=e=>{if(e.target===el(id))closeModal(id)};
});

el('dhikrSelect').onchange=()=>{
let i=Number(el('dhikrSelect').value);
if(!Number.isInteger(i)||!state.items[i])return;
state.selected=i;state.session=0;state.history=[];
state.target=Number(current().target)||0;render();
};

el('addDhikr').onclick=()=>{
let name=prompt('Enter your Dhikr name:');
if(!name||!name.trim())return;
let arabic=prompt('Arabic text (optional):')||'';
let item={name:name.trim(),ar:arabic.trim(),target:0,count:0,total:0,favorite:false,custom:true};
state.items.push(item);state.selected=state.items.length-1;
state.target=0;state.session=0;state.history=[];render();
toast('Dhikr added');
};

el('targetBtn').onclick=setTarget;
el('dailyBtn').onclick=dailyGoal;
el('favoriteBtn').onclick=()=>{
let item=current();if(!item)return;
item.favorite=true;render();toast('Saved to favorites');
};
el('favoritesBtn').onclick=showFavorites;
el('statsBtn').onclick=showStats;

el('clearCurrent').onclick=()=>{
let item=current();
if(item&&confirm('Clear count for this Dhikr?')){
item.count=0;state.session=0;state.history=[];render();
}
};

el('theme').onchange=()=>{state.settings.theme=el('theme').value;render()};
['vibration','sound','targetAlert','confirmReset'].forEach(k=>{
el(k).onchange=()=>{state.settings[k]=el(k).checked;save()};
});

el('clearAll').onclick=()=>{
if(!confirm('Delete all counters and settings?'))return;
localStorage.removeItem(KEY);state=emptyState();render();
};

render();
</script>
</body>
</html>
